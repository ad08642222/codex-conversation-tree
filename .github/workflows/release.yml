name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build source package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "codex-conversation-tree-$tag.zip"
          git archive --format=zip --prefix="codex-conversation-tree-$tag/" --output=$zip HEAD
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath "$zip.sha256" -NoNewline -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = "codex-conversation-tree-$tag.zip"
          gh release create $tag $zip "$zip.sha256" --verify-tag --generate-notes --title "Codex Conversation Tree $tag"
