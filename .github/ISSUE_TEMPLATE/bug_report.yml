name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: input
    id: codex-version
    attributes:
      label: Codex app version
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: [Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include private thread titles, paths, or session IDs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

