<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex 会话树</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0c10;--panel:#111319;--soft:#191c24;--line:#343a49;--text:#f4f1e8;--muted:#999eaa;--accent:#ff7a45;--cyan:#59c6c8;--card:#161920;--card2:#1b1f28}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}body.embedded .shell{grid-template-columns:1fr}body.embedded .side{display:none}
    button,input{font:inherit}.shell{display:grid;grid-template-columns:272px 1fr;height:100%}.side{background:linear-gradient(180deg,#12141a,#0e1015);border-right:1px solid #272b35;padding:24px 18px;display:flex;flex-direction:column;gap:18px;z-index:5}.brand{display:flex;gap:12px;align-items:center}.mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--accent),#ffb45e);box-shadow:0 8px 26px #ff7a4538;display:grid;place-items:center;color:#20120b;font-weight:900}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:3px 0 0}.search{width:100%;border:1px solid #2d323e;background:#0c0e13;color:var(--text);padding:10px 12px;border-radius:10px;outline:none}.search:focus{border-color:#5d6577}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--soft);border:1px solid #242936;border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.controls{display:flex;flex-direction:column;gap:8px}.btn{border:1px solid #303644;background:#181b23;color:var(--text);border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left}.btn:hover{background:#222632;border-color:#464e60}.check{font-size:13px;color:#c7cad2;display:flex;gap:8px;align-items:center;padding:4px 2px}.hint{margin-top:auto;border-top:1px solid #262a33;padding-top:15px;color:var(--muted);font-size:11px;line-height:1.65}.main{position:relative;overflow:hidden}.topbar{position:absolute;left:0;right:0;top:0;height:54px;border-bottom:1px solid #232833;background:#0d0f14e8;backdrop-filter:blur(14px);z-index:4;display:flex;align-items:center;padding:0 18px;gap:10px}.topbar strong{font-size:13px}.topbar .spacer{flex:1}.pill{font-size:11px;color:var(--muted);border:1px solid #2d323e;border-radius:999px;padding:5px 9px}.zoom{display:flex;gap:5px}.zoom button{width:30px;height:30px;border-radius:8px;border:1px solid #303644;background:#181b23;color:#fff;cursor:pointer}.viewport{position:absolute;inset:54px 0 0;overflow:hidden;cursor:grab;background-color:#0b0c10;background-image:radial-gradient(#323643 1px,transparent 1px);background-size:24px 24px;touch-action:none;user-select:none}.viewport.dragging{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.edges{position:absolute;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#444b5b;stroke-width:2}.edge.hot{stroke:var(--accent);stroke-width:2.5}.node{position:absolute;width:238px;min-height:92px;border:1px solid #303643;background:linear-gradient(145deg,var(--card2),var(--card));border-radius:13px;padding:12px 12px 10px;box-shadow:0 12px 35px #0005;cursor:pointer;transition:border-color .15s,transform .15s,opacity .15s}.node:hover,.node.selected{border-color:#727b90;transform:translateY(-2px)}.node.selected{box-shadow:0 0 0 1px var(--accent),0 16px 42px #0008}.node.archived{opacity:.55}.node .row{display:flex;align-items:center;gap:7px}.node .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px #59c6c888}.node.root .dot{background:var(--accent);box-shadow:0 0 10px #ff7a4588}.node h3{font-size:13px;line-height:1.4;margin:8px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.badge{font-size:9px;letter-spacing:.08em;color:#d5d8df;text-transform:uppercase}.toggle{position:absolute;right:-11px;top:35px;width:22px;height:22px;border-radius:50%;border:1px solid #4a5264;background:#1e222c;color:#fff;display:grid;place-items:center;font-size:14px;z-index:2}.toggle:hover{background:#343a49}.detail{position:absolute;right:16px;bottom:16px;width:min(380px,calc(100% - 32px));background:#11141bed;border:1px solid #313744;border-radius:14px;padding:16px;box-shadow:0 18px 50px #0009;backdrop-filter:blur(14px);z-index:4;display:none}.detail.show{display:block}.detail h2{font-size:15px;margin:0 28px 8px 0;line-height:1.45}.detail p{font-size:12px;color:#b6bbc7;line-height:1.5;margin:8px 0;max-height:72px;overflow:auto}.detail dl{display:grid;grid-template-columns:66px 1fr;gap:5px 8px;font-size:11px;margin:12px 0;color:var(--muted)}.detail dd{margin:0;color:#d1d4dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#949aa7;font-size:20px;cursor:pointer}.open{width:100%;border:0;border-radius:9px;padding:10px;background:linear-gradient(90deg,var(--accent),#ff9b55);color:#1d1009;font-weight:800;cursor:pointer}.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}.toast{position:absolute;top:68px;left:50%;transform:translateX(-50%);background:#232834;border:1px solid #41495a;border-radius:10px;padding:9px 13px;font-size:12px;z-index:8;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.detail{width:calc(100% - 24px);right:12px;bottom:12px}.node{width:210px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">枝</div><div><h1>Codex 会话树</h1><p>Conversation Lineage</p></div></div>
    <input id="search" class="search" placeholder="搜索标题、路径或 ID…">
    <div class="stats"><div class="stat"><b id="total">—</b><span>会话</span></div><div class="stat"><b id="branches">—</b><span>分支关系</span></div></div>
    <div class="controls">
      <button class="btn" id="refresh">↻　刷新真实关系</button>
      <button class="btn" id="fit">⌗　适合窗口</button>
      <button class="btn" id="expand">＋　展开全部</button>
      <button class="btn" id="collapse">－　只看主干</button>
      <label class="check"><input id="archived" type="checkbox"> 显示已归档会话</label>
    </div>
    <div class="hint">滚轮缩放 · 拖动画布<br>单击查看详情 · 双击打开 Codex<br><br>在 Codex 中使用“分支任务”后，刷新即可自动挂到父会话下，层级没有限制。</div>
  </aside>
  <main class="main">
    <div class="topbar"><strong>会话谱系图</strong><span class="pill" id="visible">载入中</span><span class="spacer"></span><span class="pill" id="updated">—</span><div class="zoom"><button id="minus">−</button><button id="plus">＋</button></div></div>
    <div id="viewport" class="viewport"><div id="world" class="world"><svg id="edges" class="edges"></svg><div id="nodes"></div></div><div id="empty" class="empty">正在读取 Codex 会话…</div></div>
    <section id="detail" class="detail"><button class="close" id="close">×</button><h2 id="dTitle"></h2><p id="dPreview"></p><dl><dt>任务 ID</dt><dd id="dId"></dd><dt>父会话</dt><dd id="dParent"></dd><dt>子分支</dt><dd id="dChildren"></dd><dt>更新时间</dt><dd id="dTime"></dd><dt>工作目录</dt><dd id="dCwd"></dd></dl><button id="open" class="open">在 Codex 中打开这个任务</button></section>
    <div id="toast" class="toast"></div>
  </main>
</div>
<script>
(()=>{
if(self!==top||new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');
const $=s=>document.querySelector(s);const viewport=$('#viewport'),world=$('#world'),nodesEl=$('#nodes'),edgesEl=$('#edges');
let all=[],shown=[],byId=new Map(),children=new Map(),positions=new Map(),selected=null,scale=.82,panX=80,panY=60,drag=null;
let savedCollapsed=[];try{savedCollapsed=JSON.parse(localStorage.getItem('codex-tree-collapsed')||'[]')}catch{}const collapsed=new Set(savedCollapsed);
const demoMode=new URLSearchParams(location.search).get('demo')==='1';
function demoData(){const now=Date.now();const node=(id,parentId,title,hours,pinned=false)=>({id,parentId,title,createdAt:now-hours*3600000,updatedAt:now-hours*3600000,archived:false,pinned,cwd:'C:\\Projects\\aurora',source:'vscode',threadSource:'user',preview:title,cliVersion:'0.147.0',openUrl:'#'});return{generatedAt:now,count:10,branchCount:7,nodes:[node('root',null,'Build the Aurora desktop app',1,true),node('design','root','Explore the new navigation design',2),node('data','root','Design the local data model',3),node('tests','root','Plan reliability and regression tests',4),node('sidebar','design','Prototype the sidebar interaction',5),node('theme','design','Compare light and dark themes',6),node('sqlite','data','Store thread relationships in SQLite',7),node('import','data','Import existing Codex sessions',8),node('drag','sidebar','Fix canvas drag and pointer capture',9),node('release','tests','Prepare the first public release',10)]}}
function date(v){return v?new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):'未知'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
async function load(force=false){$('#empty').style.display='grid';$('#empty').textContent='正在读取 Codex 会话…';try{let d;if(demoMode)d=demoData();else{const r=await fetch('/api/tree'+(force?'?refresh=1':''));d=await r.json();if(!r.ok)throw Error(d.error||'读取失败')}all=d.nodes;$('#total').textContent=d.count;$('#branches').textContent=d.branchCount;$('#updated').textContent='更新 '+date(d.generatedAt);render();if(force&&!demoMode)toast('已读取最新会话关系')}catch(e){$('#empty').textContent='读取失败：'+e.message}}
function filtered(){const q=$('#search').value.trim().toLowerCase(),showArchived=$('#archived').checked;let base=all.filter(n=>(showArchived||!n.archived)&&(!q||[n.title,n.cwd,n.id,n.preview].join(' ').toLowerCase().includes(q)));if(!q)return base;const keep=new Set(base.map(n=>n.id));let changed=true;while(changed){changed=false;for(const n of all){if(keep.has(n.id)&&n.parentId&&!keep.has(n.parentId)){keep.add(n.parentId);changed=true}}}return all.filter(n=>keep.has(n.id)&&(showArchived||!n.archived||q))}
function render(){shown=filtered();byId=new Map(shown.map(n=>[n.id,n]));children=new Map(shown.map(n=>[n.id,[]]));for(const n of shown)if(n.parentId&&children.has(n.parentId))children.get(n.parentId).push(n);for(const a of children.values())a.sort((x,y)=>y.updatedAt-x.updatedAt);const roots=shown.filter(n=>!n.parentId||!byId.has(n.parentId)).sort((a,b)=>b.updatedAt-a.updatedAt);positions.clear();let nextY=30;const gapY=118,gapX=294;
  function layout(n,depth){const kids=(children.get(n.id)||[]).filter(k=>!collapsed.has(n.id));if(!kids.length){positions.set(n.id,{x:30+depth*gapX,y:nextY});nextY+=gapY;return positions.get(n.id).y}const ys=kids.map(k=>layout(k,depth+1));const y=(ys[0]+ys[ys.length-1])/2;positions.set(n.id,{x:30+depth*gapX,y});return y}
  for(const root of roots){layout(root,0);nextY+=28}let maxX=500,maxY=Math.max(nextY,300);for(const p of positions.values()){maxX=Math.max(maxX,p.x+270);maxY=Math.max(maxY,p.y+125)}world.style.width=maxX+'px';world.style.height=maxY+'px';edgesEl.setAttribute('width',maxX);edgesEl.setAttribute('height',maxY);edgesEl.innerHTML='';nodesEl.innerHTML='';
  for(const n of shown){const p=positions.get(n.id);if(!p)continue;if(n.parentId&&positions.has(n.parentId)){const a=positions.get(n.parentId),x1=a.x+238,y1=a.y+46,x2=p.x,y2=p.y+46,m=(x1+x2)/2;edgesEl.insertAdjacentHTML('beforeend',`<path class="edge ${selected===n.id?'hot':''}" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}"/>`)}const kids=children.get(n.id)||[];const el=document.createElement('article');el.className='node '+(!n.parentId?'root ':'')+(n.archived?'archived ':'')+(selected===n.id?'selected':'');el.style.left=p.x+'px';el.style.top=p.y+'px';el.dataset.id=n.id;el.innerHTML=`<div class="row"><i class="dot"></i><span class="badge">${!n.parentId?'主会话':n.pinned?'已置顶':'子分支'}</span></div><h3></h3><div class="meta"><span>${date(n.updatedAt)}</span><span>${kids.length?kids.length+' 个子分支':'末端'}</span></div>${kids.length?`<button class="toggle" title="展开/折叠">${collapsed.has(n.id)?'+':'−'}</button>`:''}`;el.querySelector('h3').textContent=n.title;el.onclick=e=>{if(e.target.classList.contains('toggle'))return;select(n.id)};el.ondblclick=()=>openNode(n);const t=el.querySelector('.toggle');if(t)t.onclick=e=>{e.stopPropagation();collapsed.has(n.id)?collapsed.delete(n.id):collapsed.add(n.id);saveCollapsed();render()};nodesEl.appendChild(el)}$('#visible').textContent=positions.size+' 个可见节点';$('#empty').style.display=positions.size?'none':'grid';$('#empty').textContent='没有符合条件的会话';applyTransform()}
function saveCollapsed(){try{localStorage.setItem('codex-tree-collapsed',JSON.stringify([...collapsed]))}catch{}}
function select(id){selected=id;const n=byId.get(id);if(!n)return;$('#dTitle').textContent=n.title;$('#dPreview').textContent=n.preview||'暂无摘要';$('#dId').textContent=n.id;$('#dParent').textContent=n.parentId?(byId.get(n.parentId)?.title||n.parentId):'主会话';$('#dChildren').textContent=(children.get(n.id)||[]).length+' 个';$('#dTime').textContent=date(n.updatedAt);$('#dCwd').textContent=n.cwd||'—';$('#detail').classList.add('show');render()}
function openNode(n){if(document.body.classList.contains('embedded'))parent.postMessage({type:'codex-tree:open-thread',threadId:n.id},'*');else window.location.href=n.openUrl;toast('正在切换到 Codex…')}
function applyTransform(){world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`}
function fit(){if(!positions.size)return;const w=parseFloat(world.style.width),h=parseFloat(world.style.height),vw=viewport.clientWidth,vh=viewport.clientHeight;scale=Math.max(.22,Math.min(1,(vw-80)/w,(vh-70)/h));panX=35;panY=30;applyTransform()}
function endDrag(pointerId){if(!drag)return;const id=pointerId??drag.pointerId;drag=null;viewport.classList.remove('dragging');try{if(viewport.hasPointerCapture(id))viewport.releasePointerCapture(id)}catch{}}
viewport.onpointerdown=e=>{if(e.button!==0||!e.isPrimary||e.target.closest('.node'))return;e.preventDefault();endDrag();drag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY};viewport.classList.add('dragging');try{viewport.setPointerCapture(e.pointerId)}catch{}};viewport.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;if((e.buttons&1)===0){endDrag(e.pointerId);return}panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;applyTransform()};viewport.onpointerup=e=>endDrag(e.pointerId);viewport.onpointercancel=e=>endDrag(e.pointerId);viewport.onlostpointercapture=()=>endDrag();window.addEventListener('blur',()=>endDrag());document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrag()});viewport.onwheel=e=>{e.preventDefault();const old=scale;scale=Math.max(.2,Math.min(1.6,scale*(e.deltaY<0?1.1:.9)));const r=viewport.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;panX=mx-(mx-panX)*(scale/old);panY=my-(my-panY)*(scale/old);applyTransform()},{passive:false};
$('#search').oninput=render;$('#archived').onchange=render;$('#refresh').onclick=()=>load(true);$('#fit').onclick=fit;$('#expand').onclick=()=>{collapsed.clear();saveCollapsed();render();fit()};$('#collapse').onclick=()=>{for(const n of all)if(n.parentId===null&&(children.get(n.id)||[]).length)collapsed.add(n.id);saveCollapsed();render();fit()};$('#minus').onclick=()=>{scale=Math.max(.2,scale-.1);applyTransform()};$('#plus').onclick=()=>{scale=Math.min(1.6,scale+.1);applyTransform()};$('#close').onclick=()=>{$('#detail').classList.remove('show');selected=null;render()};$('#open').onclick=()=>{const n=byId.get(selected);if(n)openNode(n)};window.onresize=()=>applyTransform();load().then(()=>setTimeout(applyTransform,80));setTimeout(()=>{if(!all.length)load(true)},1200);setInterval(()=>load(false),30000);
})();
</script>
</body>
</html>
